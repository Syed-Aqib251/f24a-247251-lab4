<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen | Sheet</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="header-inner"><h1>Canteen</h1><p>Lab 04 · Types in a file</p></div></header>
  <nav aria-label="Canteen pages">
    <a href="index.html" aria-current="page">Sheet</a>
    <a href="till.html">Till</a>
    <a href="who.html">Who is in</a>
  </nav>
  <main>
    <h2>Sheet</h2>
    <p class="intro">Add canteen items to the sheet and see how their values behave.</p>
    <div class="table-wrap">
      <table aria-label="Canteen item sheet">
        <thead><tr><th>Item</th><th>Quantity</th><th>Price</th><th>Line</th><th>Note</th></tr></thead>
        <tbody id="sheet-body"><tr><td colspan="5" class="empty">No items added yet.</td></tr></tbody>
      </table>
    </div>
    <form id="item-form">
      <h3>Add an item</h3>
      <div class="fields">
        <label>Item<input id="item" name="item" type="text" placeholder="e.g. Samosa"></label>
        <label>Quantity<input id="quantity" name="quantity" type="number" step="any" placeholder="e.g. 2" required></label>
        <label>Price<input id="price" name="price" type="text" placeholder="e.g. 50 or abc"></label>
        <button type="submit">Add</button>
      </div>
      <p class="help">Try a price such as abc, or leave the item empty, to see NaN and undefined.</p>
    </form>
  </main>
  <footer>Roll number 247251 · BSCS F24 A</footer>
  <script src="script.js"></script>
</body>
</html>
