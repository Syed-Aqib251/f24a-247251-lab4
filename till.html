<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canteen | Till</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="header-inner"><h1>Canteen</h1><p>Lab 04 · Types in a file</p></div></header>
  <nav aria-label="Canteen pages">
    <a href="index.html">Sheet</a>
    <a href="till.html" aria-current="page">Till</a>
    <a href="who.html">Who is in</a>
  </nav>
  <main>
    <h2>Till</h2>
    <p class="intro">Enter the bill and the amount paid by the customer.</p>
    <form id="till-form" class="till-form">
      <div class="fields">
        <label>Bill<input id="bill" name="bill" type="number" min="0" step="any" placeholder="e.g. 200" required></label>
        <label>Paid<input id="paid" name="paid" type="number" min="0" step="any" placeholder="e.g. 300"></label>
        <button type="submit">Take</button>
      </div>
      <p class="help">Leave Paid empty to represent nothing paid.</p>
    </form>
    <section id="receipt" class="receipt" aria-label="Till result" aria-live="polite" hidden>
      <h3>Payment result</h3>
      <p>Stored paid: <output id="stored-paid"></output></p>
      <p>Kind of paid: <output id="paid-kind"></output></p>
      <p class="result-line">Change: <output id="change"></output></p>
      <p id="owed-line" hidden>Still owed: <output id="owed"></output></p>
      <p id="half-line" hidden>Half of the change: <output id="half-change"></output></p>
    </section>
  </main>
  <footer>Roll number 247251 · BSCS F24 A</footer>
  <script src="till.js"></script>
</body>
</html>
